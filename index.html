<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR TV News - সত্যের সন্ধানে নির্ভীক</title>
    <meta name="theme-color" content="#dc2626">

    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts (Hind Siliguri & Noto Serif Bengali) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .serif-title { font-family: 'Noto Serif Bengali', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Ad container auto adjustments */
        .ad-box iframe { max-width: 100% !important; margin: 0 auto; display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Global Popunder/Social Bar Script Hook -->
    <div id="globalAdScriptHook"></div>

    <!-- Top Bar -->
    <div class="bg-[#1e293b] text-slate-300 text-xs py-1.5 px-4 border-b border-slate-700">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <span id="currentBanglaDate" class="font-medium"><i class="fa-regular fa-calendar-days mr-1 text-red-400"></i> তারিখ লোড হচ্ছে...</span>
            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1 text-emerald-400 font-bold"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> লাইভ পোর্টাল</span>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="javascript:void(0)" onclick="goHome()" class="flex items-center gap-2 group">
                <div class="bg-red-600 text-white font-black text-2xl px-2.5 py-0.5 rounded tracking-tighter shadow-sm">TR</div>
                <span class="serif-title font-black text-2xl md:text-3xl text-slate-900 tracking-tight group-hover:text-red-600 transition">TV NEWS</span>
            </a>

            <div class="flex items-center gap-2">
                <button onclick="shareEntireSite()" class="text-xs bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-700 font-bold px-3 py-2 rounded-lg border border-slate-200 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-share-nodes"></i> <span class="hidden sm:inline">পোর্টাল শেয়ার</span>
                </button>
            </div>
        </div>

        <!-- Dynamic Category Navigation Bar -->
        <nav class="border-t border-slate-100 bg-white">
            <div class="max-w-6xl mx-auto px-4 flex items-center gap-1 overflow-x-auto no-scrollbar py-1" id="categoryNav">
                <button onclick="filterCategory('all')" class="cat-btn shrink-0 text-xs md:text-sm font-bold px-3 py-1.5 rounded-lg text-red-600 bg-red-50 transition" data-cat="all">প্রচ্ছদ</button>
                <span class="text-xs text-slate-400 py-1">লোড হচ্ছে...</span>
            </div>
        </nav>
    </header>

    <!-- Breaking News Alert -->
    <div id="breakingSection" class="hidden bg-red-600 text-white text-xs md:text-sm font-semibold py-1.5 px-4 shadow-inner">
        <div class="max-w-6xl mx-auto flex items-center gap-2 overflow-hidden">
            <span class="bg-black/30 px-2 py-0.5 rounded text-[11px] font-black uppercase tracking-wider shrink-0 flex items-center gap-1">
                <i class="fa-solid fa-bolt animate-bounce"></i> ব্রেকিং
            </span>
            <div class="truncate cursor-pointer hover:underline" id="breakingText">-</div>
        </div>
    </div>

    <!-- 1. Top Banner Advertisement Slot -->
    <div id="topBannerAdContainer" class="ad-box max-w-6xl mx-auto px-4 my-2.5 w-full flex justify-center items-center overflow-hidden"></div>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-3 flex-1 w-full">

        <!-- =======================================================
             VIEW 1: HOME FEED VIEW
             ======================================================= -->
        <div id="homeView" class="space-y-6">
            
            <!-- Lead Section (Big Lead Card + Trending News) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5" id="leadSection">
                <div id="mainLeadContainer" class="lg:col-span-8">
                    <div class="animate-pulse bg-slate-200 aspect-video rounded-xl"></div>
                </div>

                <div class="lg:col-span-4 flex flex-col space-y-3 bg-white p-3.5 rounded-xl border border-slate-200 shadow-xs">
                    <h3 class="font-bold text-sm text-red-600 border-b border-red-100 pb-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-fire"></i> আলোচিত খবর
                    </h3>
                    <div id="trendingNewsList" class="space-y-3 divide-y divide-slate-100 overflow-hidden">
                        <p class="text-xs text-slate-400 py-4 text-center">খবর লোড হচ্ছে...</p>
                    </div>
                </div>
            </div>

            <!-- Category / Latest News Grid -->
            <div class="space-y-4 pt-2">
                <div class="flex items-center justify-between border-b-2 border-red-600 pb-1">
                    <h2 id="currentCategoryHeading" class="serif-title font-extrabold text-lg md:text-xl text-slate-900">সর্বশেষ সংবাদ</h2>
                </div>
                <div id="newsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <!-- Cards Loaded Dynamically -->
                </div>
            </div>
        </div>

        <!-- =======================================================
             VIEW 2: SINGLE NEWS READER VIEW (Shareable ?id=...)
             ======================================================= -->
        <div id="singleNewsView" class="hidden max-w-3xl mx-auto bg-white p-4 md:p-7 rounded-2xl border border-slate-200 shadow-sm space-y-5">
            
            <div class="flex items-center justify-between">
                <button onclick="goHome()" class="text-xs font-bold text-slate-600 hover:text-red-600 flex items-center gap-1 transition">
                    <i class="fa-solid fa-arrow-left"></i> সব খবর
                </button>
                <span id="singleNewsCategory" class="text-xs font-bold bg-red-50 text-red-600 px-3 py-1 rounded-full border border-red-100">জাতীয়</span>
            </div>

            <h1 id="singleNewsTitle" class="serif-title font-black text-2xl md:text-3xl text-slate-900 leading-snug">শিরোনাম লোড হচ্ছে...</h1>

            <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500 pb-3 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <span id="singleNewsTime"><i class="fa-regular fa-clock text-red-500 mr-1"></i> -</span>
                    <span id="singleNewsViews"><i class="fa-regular fa-eye text-sky-500 mr-1"></i> 0 বার পড়া হয়েছে</span>
                </div>

                <!-- Share Buttons -->
                <div class="flex items-center gap-1.5">
                    <button onclick="shareArticle('facebook')" class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center hover:opacity-90 transition"><i class="fa-brands fa-facebook-f text-xs"></i></button>
                    <button onclick="shareArticle('whatsapp')" class="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center hover:opacity-90 transition"><i class="fa-brands fa-whatsapp text-xs"></i></button>
                    <button onclick="shareArticle('telegram')" class="w-7 h-7 rounded-full bg-sky-500 text-white flex items-center justify-center hover:opacity-90 transition"><i class="fa-brands fa-telegram text-xs"></i></button>
                    <button onclick="copyArticleLink()" class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200 text-[11px] font-bold transition flex items-center gap-1">
                        <i class="fa-regular fa-copy"></i> <span id="copyTextNotice">লিংক কপি</span>
                    </button>
                </div>
            </div>

            <!-- Media Section (Photo & Video Players) -->
            <div id="singleMediaContainer" class="space-y-4">
                <!-- Video Player Box -->
                <div id="singleNewsVideoWrapper" class="hidden w-full aspect-video rounded-xl overflow-hidden bg-black shadow-md"></div>
                <!-- Featured Image Box -->
                <div id="singleNewsImageWrapper" class="w-full aspect-video rounded-xl overflow-hidden bg-slate-100 border border-slate-200">
                    <img id="singleNewsImg" src="" class="w-full h-full object-cover" alt="News Image">
                </div>
            </div>

            <!-- News Content -->
            <div id="singleNewsContent" class="text-slate-800 text-base md:text-lg leading-relaxed space-y-4 pt-2 whitespace-pre-line font-normal">
                খবর লোড হচ্ছে...
            </div>

            <!-- 2. Dynamic In-Article Advertisement Slot -->
            <div id="inArticleAdContainer" class="ad-box w-full flex justify-center items-center my-5 p-2 bg-slate-50 border border-slate-100 rounded-xl overflow-hidden"></div>

            <div class="pt-4 border-t border-slate-200 flex items-center justify-between">
                <button onclick="goHome()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-house"></i> প্রচ্ছদে ফিরে যান
                </button>
                <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="text-xs font-bold text-slate-500 hover:text-slate-800">
                    উপরে যান <i class="fa-solid fa-arrow-up ml-0.5"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-[#0f172a] text-slate-400 text-xs mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-4 py-6 space-y-3">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2 border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <div class="bg-red-600 text-white font-black text-lg px-2 py-0.5 rounded">TR</div>
                    <span class="serif-title font-black text-xl text-white">TV NEWS</span>
                </div>
                <p class="text-slate-400 text-center sm:text-right">অনলাইন ও ডিজিটাল সংবাদ মাধ্যম | সর্বস্বত্ব সংরক্ষিত</p>
            </div>
            <div class="text-center text-[11px] text-slate-500">
                ওয়েবসাইট: <a href="https://trtvnews.netlify.app" class="text-red-400 hover:underline">trtvnews.netlify.app</a>
            </div>
        </div>
    </footer>

    <script>
        const SITE_URL = "https://trtvnews.netlify.app";

        // ==========================================================
        //  ১. Firebase Config & Database Paths
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
            authDomain: "new-all-f99f7.firebaseapp.com",
            databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
            projectId: "new-all-f99f7",
            storageBucket: "new-all-f99f7.firebasestorage.app",
            messagingSenderId: "1069748173900",
            appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const DB_PATHS = {
            NEWS: 'trnews_app/news',
            CATEGORIES: 'trnews_app/categories',
            ADS: 'trnews_app/ads'
        };

        let allNewsData = [];
        let currentCategory = 'all';
        let currentOpenArticle = null;

        // Bengali Date
        function updateBanglaDate() {
            const date = new Date();
            const days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
            const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
            const toBanglaNum = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);

            document.getElementById('currentBanglaDate').innerHTML = `<i class="fa-regular fa-calendar-days mr-1 text-red-400"></i> ${days[date.getDay()]}, ${toBanglaNum(date.getDate())} ${months[date.getMonth()]} ${toBanglaNum(date.getFullYear())}`;
        }
        updateBanglaDate();

        // Categories
        function loadCategories() {
            db.ref(DB_PATHS.CATEGORIES).on('value', snapshot => {
                const data = snapshot.val();
                const nav = document.getElementById('categoryNav');
                nav.innerHTML = `<button onclick="filterCategory('all')" class="cat-btn shrink-0 text-xs md:text-sm font-bold px-3 py-1.5 rounded-lg text-red-600 bg-red-50 transition" data-cat="all">প্রচ্ছদ</button>`;

                if (data) {
                    Object.keys(data).forEach(key => {
                        const cat = data[key];
                        nav.innerHTML += `<button onclick="filterCategory('${cat.name}')" class="cat-btn shrink-0 text-xs md:text-sm font-semibold px-3 py-1.5 rounded-lg text-slate-700 hover:text-red-600 hover:bg-slate-50 transition" data-cat="${cat.name}">${cat.name}</button>`;
                    });
                }
            });
        }

        function filterCategory(catName) {
            currentCategory = catName;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.dataset.cat === catName) {
                    btn.className = 'cat-btn shrink-0 text-xs md:text-sm font-bold px-3 py-1.5 rounded-lg text-red-600 bg-red-50 transition';
                } else {
                    btn.className = 'cat-btn shrink-0 text-xs md:text-sm font-semibold px-3 py-1.5 rounded-lg text-slate-700 hover:text-red-600 hover:bg-slate-50 transition';
                }
            });

            document.getElementById('currentCategoryHeading').innerText = (catName === 'all') ? 'সর্বশেষ সংবাদ' : catName;
            renderNewsFeed();
        }

        // ==========================================================
        //  ২. News Feed Engine
        // ==========================================================
        function initNewsEngine() {
            db.ref(DB_PATHS.NEWS).on('value', snapshot => {
                const data = snapshot.val();
                allNewsData = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allNewsData.push({ id: key, ...data[key] });
                    });
                    allNewsData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                }

                // Breaking
                const breaking = allNewsData.find(n => n.isBreaking);
                const breakingBox = document.getElementById('breakingSection');
                if (breaking) {
                    breakingBox.classList.remove('hidden');
                    const txt = document.getElementById('breakingText');
                    txt.innerText = breaking.title;
                    txt.onclick = () => openNews(breaking.id);
                } else {
                    breakingBox.classList.add('hidden');
                }

                // Direct URL Query ?id=XYZ
                const urlParams = new URLSearchParams(window.location.search);
                const queryNewsId = urlParams.get('id');

                if (queryNewsId) {
                    openNews(queryNewsId, false);
                } else {
                    renderNewsFeed();
                }
            });
        }

        function renderNewsFeed() {
            const leadContainer = document.getElementById('mainLeadContainer');
            const trendingList = document.getElementById('trendingNewsList');
            const grid = document.getElementById('newsGrid');

            let filtered = (currentCategory === 'all') ? allNewsData : allNewsData.filter(n => n.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 font-medium">কোনো সংবাদ পাওয়া যায়নি।</div>`;
                leadContainer.innerHTML = `<div class="p-8 text-center text-slate-400 bg-white rounded-xl border border-slate-200">কোনো লিড সংবাদ নেই</div>`;
                trendingList.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">তালিকা খালি</p>`;
                return;
            }

            // Lead Item
            const leadNews = filtered.find(n => n.isLead) || filtered[0];
            const hasVideoLead = Boolean(leadNews.videoUrl);
            const leadImg = leadNews.imageUrl || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800';

            leadContainer.innerHTML = `
                <div onclick="openNews('${leadNews.id}')" class="group cursor-pointer bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-md transition flex flex-col">
                    <div class="relative aspect-video w-full overflow-hidden bg-slate-900">
                        <img src="${leadImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${leadNews.title}">
                        ${hasVideoLead ? `<span class="absolute bottom-3 right-3 bg-red-600 text-white text-xs px-2.5 py-1 rounded-full font-bold shadow-md flex items-center gap-1.5"><i class="fa-solid fa-play text-[10px]"></i> ভিডিও</span>` : ''}
                        <span class="absolute top-3 left-3 bg-red-600 text-white text-xs px-2.5 py-0.5 rounded font-bold shadow-sm">${leadNews.category || 'সংবাদ'}</span>
                    </div>
                    <div class="p-4 md:p-5 space-y-2">
                        <h2 class="serif-title font-black text-xl md:text-2xl text-slate-900 group-hover:text-red-600 transition leading-snug">${leadNews.title}</h2>
                        <p class="text-xs md:text-sm text-slate-600 line-clamp-2 leading-relaxed">${leadNews.content}</p>
                        <div class="flex items-center gap-3 text-[11px] text-slate-400 pt-2 border-t border-slate-100">
                            <span><i class="fa-regular fa-clock mr-1"></i> ${leadNews.timeString || 'কিছুক্ষণ আগে'}</span>
                            <span><i class="fa-regular fa-eye mr-1"></i> ${leadNews.views || 1}</span>
                        </div>
                    </div>
                </div>
            `;

            // Trending 4 Items
            const remainingForTrending = filtered.filter(n => n.id !== leadNews.id).slice(0, 4);
            trendingList.innerHTML = '';
            if (remainingForTrending.length === 0) {
                trendingList.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">সংবাদ তালিকা খালি</p>`;
            } else {
                remainingForTrending.forEach(item => {
                    const img = item.imageUrl || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=200';
                    trendingList.innerHTML += `
                        <div onclick="openNews('${item.id}')" class="pt-2.5 first:pt-0 cursor-pointer group flex gap-2.5 items-start">
                            <div class="relative w-16 h-12 shrink-0 rounded-lg overflow-hidden bg-slate-100">
                                <img src="${img}" class="w-full h-full object-cover">
                                ${item.videoUrl ? `<span class="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-[10px]"><i class="fa-solid fa-play"></i></span>` : ''}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-xs text-slate-800 group-hover:text-red-600 line-clamp-2 transition leading-tight">${item.title}</h4>
                                <span class="text-[10px] text-slate-400">${item.timeString || ''}</span>
                            </div>
                        </div>
                    `;
                });
            }

            // Grid Items
            const gridItems = filtered.filter(n => n.id !== leadNews.id);
            grid.innerHTML = '';
            gridItems.forEach(item => {
                const img = item.imageUrl || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=400';
                grid.innerHTML += `
                    <div onclick="openNews('${item.id}')" class="group cursor-pointer bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="relative aspect-video w-full overflow-hidden bg-slate-900">
                                <img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                ${item.videoUrl ? `<span class="absolute bottom-2 right-2 bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow flex items-center gap-1"><i class="fa-solid fa-play text-[8px]"></i> ভিডিও</span>` : ''}
                                <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[10px] px-2 py-0.5 rounded font-bold">${item.category}</span>
                            </div>
                            <div class="p-3.5 space-y-1.5">
                                <h3 class="serif-title font-bold text-sm md:text-base text-slate-900 group-hover:text-red-600 line-clamp-2 transition leading-snug">${item.title}</h3>
                                <p class="text-xs text-slate-500 line-clamp-2">${item.content}</p>
                            </div>
                        </div>
                        <div class="px-3.5 pb-3 pt-2 text-[10px] text-slate-400 border-t border-slate-100 flex items-center justify-between">
                            <span><i class="fa-regular fa-clock mr-1"></i> ${item.timeString || ''}</span>
                            <span><i class="fa-regular fa-eye mr-1"></i> ${item.views || 1}</span>
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================================
        //  ৩. Single News Detail & Video Embed Logic
        // ==========================================================
        function parseVideoEmbed(url) {
            if (!url) return '';
            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
            if (ytMatch && ytMatch[1]) {
                return `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&rel=0" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
            }
            return `<video src="${url}" controls autoplay class="w-full h-full object-contain"></video>`;
        }

        function openNews(newsId, updateUrl = true) {
            const article = allNewsData.find(n => n.id === newsId);
            if (!article) return;

            currentOpenArticle = article;
            db.ref(`${DB_PATHS.NEWS}/${newsId}/views`).transaction(v => (v || 0) + 1);

            if (updateUrl) {
                const newUrl = `${window.location.origin}${window.location.pathname}?id=${newsId}`;
                window.history.pushState({ path: newUrl }, '', newUrl);
            }

            document.getElementById('singleNewsTitle').innerText = article.title;
            document.title = `${article.title} - TR TV News`;
            document.getElementById('singleNewsCategory').innerText = article.category || 'সংবাদ';
            document.getElementById('singleNewsTime').innerHTML = `<i class="fa-regular fa-clock text-red-500 mr-1"></i> ${article.timeString || ''}`;
            document.getElementById('singleNewsViews').innerHTML = `<i class="fa-regular fa-eye text-sky-500 mr-1"></i> ${(article.views || 0) + 1} বার পড়া হয়েছে`;
            document.getElementById('singleNewsContent').innerText = article.content;

            const videoWrapper = document.getElementById('singleNewsVideoWrapper');
            const imgWrapper = document.getElementById('singleNewsImageWrapper');
            const singleImg = document.getElementById('singleNewsImg');

            if (article.videoUrl && article.videoUrl.trim()) {
                videoWrapper.innerHTML = parseVideoEmbed(article.videoUrl.trim());
                videoWrapper.classList.remove('hidden');
            } else {
                videoWrapper.innerHTML = '';
                videoWrapper.classList.add('hidden');
            }

            if (article.imageUrl && article.imageUrl.trim()) {
                singleImg.src = article.imageUrl.trim();
                imgWrapper.classList.remove('hidden');
            } else {
                imgWrapper.classList.add('hidden');
            }

            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('singleNewsView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            document.title = "TR TV News - সত্যের সন্ধানে নির্ভীক";
            const cleanUrl = `${window.location.origin}${window.location.pathname}`;
            window.history.pushState({ path: cleanUrl }, '', cleanUrl);

            document.getElementById('singleNewsVideoWrapper').innerHTML = '';
            document.getElementById('singleNewsView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
            renderNewsFeed();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onpopstate = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const queryNewsId = urlParams.get('id');
            if (queryNewsId) {
                openNews(queryNewsId, false);
            } else {
                goHome();
            }
        };

        // Social Share
        function getShareableArticleUrl() {
            if (!currentOpenArticle) return SITE_URL;
            return `${SITE_URL}/?id=${currentOpenArticle.id}`;
        }

        function shareArticle(platform) {
            const url = getShareableArticleUrl();
            const title = currentOpenArticle ? currentOpenArticle.title : "TR TV News";
            let link = '';

            if (platform === 'facebook') link = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
            if (platform === 'whatsapp') link = `https://api.whatsapp.com/send?text=${encodeURIComponent(title + '\n' + url)}`;
            if (platform === 'telegram') link = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
            
            if (link) window.open(link, '_blank');
        }

        function copyArticleLink() {
            const url = getShareableArticleUrl();
            navigator.clipboard.writeText(url);
            const btn = document.getElementById('copyTextNotice');
            btn.innerText = "কপি হয়েছে!";
            setTimeout(() => { btn.innerText = "লিংক কপি"; }, 2000);
        }

        function shareEntireSite() {
            if (navigator.share) {
                navigator.share({ title: 'TR TV News', url: SITE_URL }).catch(() => {});
            } else {
                navigator.clipboard.writeText(SITE_URL);
                alert("ওয়েবসাইট লিংক কপি করা হয়েছে!");
            }
        }

        // ==========================================================
        //  ৪. Advanced Ad Engine (Isolated Iframe & Direct Script Runner)
        // ==========================================================
        function safeInjectBannerAd(containerId, adCode) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (!adCode || !adCode.trim()) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = '';

            // Create an iframe to safely render Adsterra / Google Ads
            const iframe = document.createElement('iframe');
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.minHeight = '60px';
            iframe.scrolling = 'no';
            iframe.setAttribute('frameBorder', '0');
            iframe.setAttribute('allowTransparency', 'true');
            container.appendChild(iframe);

            const doc = iframe.contentWindow || iframe.contentDocument.document || iframe.contentDocument;
            doc.document.open();
            doc.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>
                        body { margin:0; padding:0; display:flex; justify-content:center; align-items:center; background:transparent; overflow:hidden; }
                    </style>
                </head>
                <body>
                    ${adCode}
                    <script>
                        window.onload = function() {
                            setTimeout(function() {
                                var h = document.body.scrollHeight || document.documentElement.scrollHeight;
                                if(h > 30) {
                                    window.frameElement.style.height = h + 'px';
                                }
                            }, 600);
                        };
                    <\/script>
                </body>
                </html>
            `);
            doc.document.close();
        }

        // Global Popunder / Social Bar Injector
        function executeGlobalAdScript(scriptCode) {
            if (!scriptCode || !scriptCode.trim()) return;
            const hook = document.getElementById('globalAdScriptHook');
            hook.innerHTML = '';
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = scriptCode;
            const scripts = tempDiv.querySelectorAll('script');

            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                if (oldScript.src) {
                    newScript.src = oldScript.src;
                    newScript.async = true;
                } else {
                    newScript.textContent = oldScript.textContent;
                }
                document.head.appendChild(newScript);
            });
        }

        function listenToAds() {
            db.ref(DB_PATHS.ADS).on('value', snap => {
                const ads = snap.val() || {};
                if (ads.topBanner) safeInjectBannerAd('topBannerAdContainer', ads.topBanner);
                if (ads.inArticle) safeInjectBannerAd('inArticleAdContainer', ads.inArticle);
                if (ads.globalScript) executeGlobalAdScript(ads.globalScript);
            });
        }

        // Init
        loadCategories();
        initNewsEngine();
        listenToAds();
    </script>
</body>
</html>
